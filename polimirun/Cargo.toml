[package]
name = "polimirun"
version = "0.1.0"
edition = "2024"
description = "Polimirun results from endu.net: unified schema, rankings, CLI"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
deunicode = "1.6.2"
endu = { path = "../endu" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
